services:
  - type: web
    name: bottled-slowly-ai-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: backend
    buildCommand: npm install && npx prisma migrate deploy && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bottled-slowly-ai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        value: ""
      - key: PORT
        value: 3001
      - key: FRONTEND_URL
        value: https://bottled-slowly-ai.vercel.app
      - key: NODE_ENV
        value: production

databases:
  - name: bottled-slowly-ai-db
    plan: free
    region: oregon
