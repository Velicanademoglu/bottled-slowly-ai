services:
  - type: web
    name: bottled-slowly-ai
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    rootDir: backend
    buildCommand: cd ../frontend && npm install --include=dev && npm run build && cd ../backend && npm install --include=dev && npx prisma migrate deploy && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bottled-slowly-ai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        value: ""
      - key: NODE_ENV
        value: production

databases:
  - name: bottled-slowly-ai-db
    plan: free
    region: frankfurt
